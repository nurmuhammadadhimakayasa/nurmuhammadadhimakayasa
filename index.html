<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V22 AUTO DELIVERY TANPA WA - 111 PRODUK</title>
<style>
:root{--g:#00ff88;--c:#00d4ff;--bg:#070a12}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:#eef2ff}
.w{max-width:960px;margin:0 auto;padding:16px}
.card{background:linear-gradient(180deg,#131c39,#0d1329);border:1px solid #1d2f60;border-radius:18px;padding:18px;margin:12px 0}
.btn{width:100%;padding:14px;border-radius:12px;font-weight:800;border:0;cursor:pointer;margin:7px 0;display:block;text-align:center;text-decoration:none}
.g{background:linear-gradient(90deg,#00ff88,#00d4aa);color:#001a0f}
.y{background:linear-gradient(90deg,#ffcc00,#ff9500);color:#1a1200}
.d{background:#0c1228;border:1px solid #2a3a66;color:#a8bbeb}
.term{background:#060914;border:1px solid #1a264d;border-radius:12px;padding:12px;font-family:monospace;font-size:11px;color:#7ee0ff;white-space:pre-wrap}
#vault{display:none}#vault.on{display:block}
.s{font-size:11px;color:#8aa0c0}
</style>
</head>
<body>
<div class="w">
<h1>V22 <span style="background:linear-gradient(90deg,#00ff88,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">KLIK BAYAR = FILE LANGSUNG DARI SISTEM</span></h1>
<div class="card">
<button class="btn g" onclick="deliver('EBOOK')">📘 KLIK EBOOK - LANGSUNG DOWNLOAD</button>
<button class="btn y" onclick="deliver('BUNDLE-111')">📦 BUNDLE 111 PRODUK - AUTO KIRIM</button>
<button class="btn g" onclick="deliver('STARTER-199K')">💳 BAYAR 199K - AUTO DAPAT FILE</button>
<button class="btn y" onclick="deliver('PRO-299K')">🚀 BAYAR 299K - 111 PRODUK AUTO</button>
<div class="term">BRI: 015901054376505 - HERY HERMAWAN - File dibuat otomatis oleh sistem (Blob Container) tanpa WA manual</div>
</div>
<div class="card" id="vault">
<b id="v_title">✅ TERKIRIM</b><div class="term" id="v_log"></div>
<button class="btn g" onclick="downloadNow()">📥 DOWNLOAD FILE CONTAINER</button>
</div>
</div>
<script>
let current=null;
const CATALOG=`V22 AUTO - HERY HERMAWAN - BRI 015901054376505\n111 PRODUK + TEMPLATE 20 BAHASA\nLisensi Selamanya\n`;
function deliver(type){
 current={type,trx:'AUTO-'+Date.now(),time:new Date().toLocaleString('id-ID')};
 const v=document.getElementById('vault');v.classList.add('on');
 document.getElementById('v_log').innerText='Paket: '+type+'\nTRX: '+current.trx+'\nWaktu: '+current.time+'\nStatus: File dibuat sistem';
 downloadNow();
}
function downloadNow(){
 if(!current)return;
 const blob=new Blob([CATALOG+'\nPaket:'+current.type+'\nTRX:'+current.trx],{type:'application/octet-stream'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=current.type+'-AUTO.txt';a.click();
}
</script>
</body>
</html>
